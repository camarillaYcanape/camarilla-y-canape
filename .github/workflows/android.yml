name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.2.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Preparar activos (misma web que Pages) e iconos
        run: |
          pip install pillow
          mkdir -p android/app/src/main/assets
          cp index.html sw.js android/app/src/main/assets/
          python3 android/make_icons.py
      - name: Compilar version previa (versionCode 1) para probar la actualizacion
        run: |
          cd android
          gradle --no-daemon assembleDebug assembleRelease -PappVersionCode=1
          mkdir -p ../prev
          cp app/build/outputs/apk/debug/app-debug.apk ../prev/app-debug-prev.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../prev/release-prev-unsigned.apk
      - name: Compilar
        run: |
          cd android
          gradle --no-daemon assembleDebug assembleRelease -PappVersionCode=${{ github.run_number }}
      - name: Firmar release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cyc.jks"
          mkdir -p out
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/al.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cyc.jks" --ks-pass env:KS_PASS --out out/camarillaYcanape.apk "$RUNNER_TEMP/al.apk"
          "$BT/zipalign" -f 4 prev/release-prev-unsigned.apk "$RUNNER_TEMP/alp.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cyc.jks" --ks-pass env:KS_PASS --out out/release-prev.apk "$RUNNER_TEMP/alp.apk"
          cp prev/app-debug-prev.apk out/
          "$BT/apksigner" verify --print-certs out/camarillaYcanape.apk | head -3 | tee out/firma.txt
          "$BT/aapt2" dump badging out/camarillaYcanape.apk | grep -E "package:|sdkVersion|uses-permission|application-label:" | tee out/apk-info.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          rm -f "$RUNNER_TEMP/cyc.jks"
      - name: Prueba de la web en navegador (sin puente Android)
        run: |
          mkdir -p evidence
          (cd /tmp && npm i playwright-core >/dev/null 2>&1)
          (python3 -m http.server 8099 >/dev/null 2>&1 &) ; sleep 2
          NODE_PATH=/tmp/node_modules node android/web_test.mjs 2>&1 | tee evidence/web-navegador.txt
        continue-on-error: true
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/e2e.sh out/app-debug.apk out/camarillaYcanape.apk out/app-debug-prev.apk out/release-prev.apk
        continue-on-error: true
      - name: Publicar APK y evidencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          cp out/camarillaYcanape.apk out/firma.txt out/apk-info.txt evidence/ 2>/dev/null || true
          V=$(cut -d' ' -f1 evidence/veredicto.txt 2>/dev/null || echo FAIL)
          grep -q 'WEB OK' evidence/web-navegador.txt 2>/dev/null || V=FAIL
          # La release estable solo se sustituye si el mensaje del commit lo pide con [publicar]
          case "${{ github.event.head_commit.message }}" in *"[publicar]"*) ;; *) [ "$V" = "PASS" ] && V=PASS-SIN-PUBLICAR ;; esac
          if [ "$V" = "PASS" ]; then
            gh release delete android-latest --yes --cleanup-tag || true
            gh release create android-latest evidence/* --title "camarillaYcanape para Android (build ${{ github.run_number }})" --notes "APK firmada y evidencias de prueba en emulador (veredicto PASS). Commit ${{ github.sha }}."
          else
            gh release delete android-prueba-${{ github.run_number }} --yes --cleanup-tag || true
            gh release create android-prueba-${{ github.run_number }} evidence/* --prerelease --title "PRUEBA NO VALIDADA build ${{ github.run_number }}" --notes "Build de PRUEBA, no publicada como estable (resultado: $V; ver veredicto.txt y web-navegador.txt). La release estable android-latest no se ha tocado. Commit ${{ github.sha }}."
          fi
