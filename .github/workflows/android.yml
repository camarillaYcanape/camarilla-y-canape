name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.2.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Preparar activos (misma web que Pages) e iconos
        run: |
          pip install pillow
          mkdir -p android/app/src/main/assets
          cp index.html sw.js android/app/src/main/assets/
          python3 android/make_icons.py
      - name: Compilar
        run: |
          cd android
          gradle --no-daemon assembleDebug assembleRelease -PappVersionCode=${{ github.run_number }}
      - name: Firmar release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cyc.jks"
          mkdir -p out
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/al.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cyc.jks" --ks-pass env:KS_PASS --out out/camarillaYcanape.apk "$RUNNER_TEMP/al.apk"
          "$BT/apksigner" verify --print-certs out/camarillaYcanape.apk | head -3 | tee out/firma.txt
          "$BT/aapt2" dump badging out/camarillaYcanape.apk | grep -E "package:|sdkVersion|uses-permission|application-label:" | tee out/apk-info.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          rm -f "$RUNNER_TEMP/cyc.jks"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/e2e.sh out/app-debug.apk out/camarillaYcanape.apk
        continue-on-error: true
      - name: Publicar APK y evidencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          cp out/camarillaYcanape.apk out/firma.txt out/apk-info.txt evidence/ 2>/dev/null || true
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest evidence/* --title "camarillaYcanape para Android (build ${{ github.run_number }})" --notes "APK firmada y evidencias de prueba en emulador. Commit ${{ github.sha }}."
