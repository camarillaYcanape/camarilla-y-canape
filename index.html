  if(st!=='granted'){toast('Permiso de avisos denegado. Actívalo en Ajustes del móvil o usa el calendario.');return;}
  const t0=Date.now(),b0=new Date(plan.date+'T00:00:00').getTime(),it=[];
  for(const x of v.list){const at=b0+(x.at-15)*60000;if(at>t0)it.push({id:x.p.id,t:x.p.n+' · '+clock(x.at),b:'En 15 minutos. '+(x.p.s||''),at});}
  if(!it.length){toast('Todas las paradas ya han pasado o están a menos de 15 min.');return;}
  AndroidApp.scheduleReminders(JSON.stringify(it));notifTimers=it.map(()=>0);toast(it.length+' avisos programados en el móvil. Pueden retrasarse si el sistema ahorra batería; el calendario es más fiable.');render();return;}
 if(!('Notification' in window)){toast('Este navegador no admite avisos. Usa el calendario.');return;}
 const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Permiso de avisos denegado. Puedes usar el calendario.');return;}
 const now=new Date(),base=new Date(plan.date+'T00:00:00');let n=0;
 for(const x of v.list){const when=base.getTime()+(x.at-15)*60000-now.getTime();if(when>0&&when<2147483000){notifTimers.push(setTimeout(()=>showN(x),when));n++;}}
 if(!n){toast('Todas las paradas ya han pasado o están a menos de 15 min.');return;}toast(n+' avisos programados mientras esta pestaña siga abierta. Para avisos fiables, usa el calendario.');render();}
async function showN(x){const t=x.p.n+' · '+clock(x.at);const o={body:'En 15 minutos. '+(x.p.s||''),tag:x.p.id,icon:undefined};try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)reg.showNotification(t,o);else new Notification(t,o);}catch{try{new Notification(t,o);}catch{}}}
function shareUrl(){const o={a:plan.area==='Cerca'?'Eixample':plan.area,m:plan.mood,s:plan.start,d:plan.date,c:plan.count,f:plan.cafe,u:plan.dur,p:plan.stops};return location.origin+location.pathname+'#/ruta?plan='+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function importShared(){const m=location.hash.match(/plan=([^&]+)/);if(!m)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));const p={...defaults(),area:o.a,mood:o.m,start:o.s,date:o.d<today()?today():o.d,count:o.c,cafe:o.f,dur:o.u,stops:o.p,visited:[]};if(validPlan(p)){plan=p;origin=null;save();if(Array.isArray(p.stops)&&p.stops.length&&p.area!=='Cerca'){}}}catch{}history.replaceState(null,'',location.pathname+'#/ruta');}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('Este navegador no tiene ubicación.'));navigator.geolocation.getCurrentPosition(p=>res({la:p.coords.latitude,lo:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(new Error(e.code===1?'Has denegado el permiso de ubicación.':'No he podido obtener tu ubicación.')),{enableHighAccuracy:true,timeout:15000,maximumAge:30000});});}
/* eventos */
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
 if(d.choice==='Mostrar'){window.__ef=d.value;render();}
 else if(d.choice){const k=d.choice;if(k==='Barrio')update({area:d.value},true);else if(k==='Galerías')update({count:+d.value},true);else update({dur:+d.value},true);}
  else if(d.expoics!==undefined){const x=EXPO[+d.expoics];const day=x.s>today()?x.s:today();const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';let st,en;if(x.h1){st='DTSTART;TZID=Europe/Madrid:'+x.s.replace(/-/g,'')+'T'+x.h1.replace(':','')+'00';en='DTEND;TZID=Europe/Madrid:'+x.s.replace(/-/g,'')+'T'+x.h2.replace(':','')+'00';}else{st='DTSTART;VALUE=DATE:'+day.replace(/-/g,'');en='DTEND;VALUE=DATE:'+new Date(new Date(day+'T12:00:00').getTime()+86400000).toISOString().slice(0,10).replace(/-/g,'');}const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//camarillaYcanape//ES','BEGIN:VEVENT','UID:ev'+d.expoics+'@camarillaycanape','DTSTAMP:'+stamp,st,en,'SUMMARY:'+icsText(TYN[x.y]+': '+x.t+' ('+x.g+')'),'LOCATION:'+icsText(x.a||x.g+', Barcelona'),'DESCRIPTION:'+icsText('Fuente: '+x.u+' Confirma fecha y horario con la galería.'),'BEGIN:VALARM','TRIGGER:'+(x.h1?'-PT1H':'-PT12H'),'ACTION:DISPLAY','DESCRIPTION:'+icsText(x.t),'END:VALARM','END:VEVENT','END:VCALENDAR'];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='galeria-evento.ics';document.body.appendChild(a);a.click();a.remove();}
 else if(d.mood)update({mood:d.mood},true);
 else if(b.id==='gen'){busy=true;render();await generate();busy=false;render();}
 else if(b.id==='regen'){plan.stops=build();plan.visited=[];legs=null;save();msg='';render();}
 else if(b.id==='reset')update({visited:[]});
 else if(b.id==='defaults'){plan=defaults();origin=null;legs=null;save();notifTimers.forEach(clearTimeout);notifTimers=[];render();}
 else if(b.id==='geo'){msg='Buscando tu ubicación…';render();const p=await getPos();origin={la:p.la,lo:p.lo};if(!P.some(x=>hav(p.la,p.lo,x.la,x.lo)<3000)){msg='Estás lejos de las zonas con datos (solo Barcelona centro). Prueba una dirección de la ciudad.';}else msg='Ubicación fijada. No se guarda.';plan={...plan,area:'Cerca',originLabel:'',stops:null,visited:[]};save();render();}
 else if(d.swap)swapStop(d.swap);
 else if(d.here){const p=BYID[d.here];toast('Comprobando…');const g=await getPos();const dd=hav(g.la,g.lo,p.la,p.lo);if(dd<=150+Math.min(g.acc||0,100)){update({visited:[...new Set([...plan.visited,p.id])]});}else toast('Estás a unos '+Math.round(dd)+' m de '+p.n+'. Acércate y vuelve a probar.');}
 else if(b.id==='ics'){const v=stopsView();const bl=new Blob([ics(v)],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='paseo-galerias.ics';document.body.appendChild(a);a.click();a.remove();toast('Archivo descargado. Ábrelo para añadirlo a tu calendario.');}
 else if(b.id==='notif')await notify(stopsView());
 else if(b.id==='share'){const u=shareUrl();try{if(navigator.share)await navigator.share({title:'Mi paseo de galerías',url:u});else{await navigator.clipboard.writeText(u);toast('Enlace copiado. Incluye zona, día, hora y paradas; no tu ubicación.');}}catch{toast('No se pudo compartir.');}}
 }catch(err){msg=err&&err.message?err.message:'Algo ha fallado. Inténtalo de nuevo.';busy=false;render();}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='start'){if(/^([01]\d|2[0-3]):[0-5]\d$/.test(t.value))update({start:t.value},true);else{t.value=plan.start;t.reportValidity();}}
 if(t.id==='date'){if(t.value&&t.value>=today())update({date:t.value},true);else{t.value=plan.date;}}
 if(t.id==='osrmok'){osrmOk=t.checked;legs=null;render();}if(t.id==='cafe')update({cafe:t.checked},true);
 if(t.dataset.visited)update({visited:t.checked?[...new Set([...plan.visited,t.dataset.visited])]:plan.visited.filter(x=>x!==t.dataset.visited)});});
window.addEventListener('hashchange',()=>{msg='';render();document.getElementById('content').focus({preventScroll:true});window.scrollTo(0,0);});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
importShared();render();
</script></body></html>
